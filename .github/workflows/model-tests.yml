name: Model Compatibility Tests

# Manual only: each run downloads multi-GB weights from HuggingFace, which is
# not something to do nightly on hosted runners.
on:
  workflow_dispatch:

concurrency:
  group: model-tests
  # A running dispatch is never killed mid-download; a newer dispatch replaces a still-pending one.
  cancel-in-progress: false

jobs:
  test-models:
    name: Test Inference & Benchmarks
    runs-on: [self-hosted, macOS, ARM64]
    # It downloads multi-GB weights; without a ceiling a stalled fetch holds the
    # runner for the default six hours.
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      # No actions/cache for ~/.cache/huggingface: on the self-hosted runner that directory
      # already persists, and uploading multi-GB weights to the Actions cache only evicts
      # everything else from its 10 GB quota.
      # Unit tests are not repeated here: Unit Tests runs them on every PR and on main.
      # Both binaries are built first: build_metal.swift drops mlx.metallib next to the
      # binaries only in build directories that already exist.
      - name: Build
        run: |
          swift build --product Basalt
          swift build -c release --product PerformanceBenchmark

      - name: MLX Metal kernels
        uses: ./.github/actions/mlx-metallib
        
      - name: Download test model (Qwen3.5 4B)
        run: |
          swift run Basalt models download mlx-community/Qwen3.5-4B-4bit
          
      - name: Run Performance Benchmark
        run: |
          swift run -c release PerformanceBenchmark --model mlx-community/Qwen3.5-4B-4bit --iterations 5 --tokens 50 --degradation-test
          
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: context_latency.json
          retention-days: 30
