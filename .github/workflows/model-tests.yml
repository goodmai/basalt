name: Model Compatibility Tests

# Manual only: each run downloads multi-GB weights from HuggingFace, which is
# not something to do nightly on hosted runners.
on:
  workflow_dispatch:

jobs:
  test-models:
    name: Test Inference & Benchmarks
    runs-on: macos-15 # M1/M2 runners are required for MLX
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # Same reason as the audit workflow: a pinned 6.0 toolchain cannot parse
      # mlx-swift-lm's manifest. Use the runner's Xcode.
      - name: Cache HuggingFace Models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            hf-models-
            
      - name: Build tests
        run: swift build --build-tests
        
      # MLX aborts the whole test process when it cannot find a metallib, and a
      # SwiftPM build produces none. Same two steps as the release workflow.
      - name: Cache MLX metallib
        uses: actions/cache@v6
        with:
          path: default.metallib
          key: metallib-${{ hashFiles('Package.resolved') }}

      - name: Compile MLX Metal kernels
        run: ./scripts/build_metal.swift --skip-unsupported

      - name: Run unit tests
        run: swift test
        
      - name: Download test model (Qwen3.5 4B)
        run: |
          swift run GemmaServer models download mlx-community/Qwen3.5-4B-4bit
          
      - name: Run Performance Benchmark
        run: |
          swift run -c release PerformanceBenchmark --model mlx-community/Qwen3.5-4B-4bit --iterations 5 --tokens 50 --degradation-test
          
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: context_latency.json
          retention-days: 30
