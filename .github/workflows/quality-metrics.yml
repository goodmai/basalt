name: Quality Metrics

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  fast-check:
    name: Fast quality metrics & hygiene
    runs-on: ubuntu-latest
    container: swift:6.1-noble@sha256:6d5517e79420e85f3269422c4cc64c61a75ba5b1489565eea72f01f5be504780
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install curl, jq and python3 for OSV scan
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq python3
      - name: Checker self-test
        run: swift scripts/check_quality_metrics_test.swift
      - name: Concurrency hatches check
        run: swift scripts/check_concurrency_hatches.swift
      - name: OSV dependency scan
        id: osv
        run: |
          if ./scripts/security_audit.sh --osv-only; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Compute quality metrics & enforce fast gates
        env:
          OSV_OK: ${{ steps.osv.outputs.ok }}
        run: |
          FLAGS=""
          if [ "$OSV_OK" = "true" ]; then FLAGS="--osv-ok"; fi
          swift scripts/check_quality_metrics.swift $FLAGS --write-badges /tmp/basalt-badges | tee /tmp/basalt-metrics.txt
          {
            echo "### Basalt Fast-Check Quality Metrics"
            echo '```'
            cat /tmp/basalt-metrics.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-badges:
    name: Publish live README badges
    needs: fast-check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: quality-metrics-badges
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container: swift:6.1-noble@sha256:6d5517e79420e85f3269422c4cc64c61a75ba5b1489565eea72f01f5be504780
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install curl, jq and python3 for OSV scan
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq python3
      - name: Generate badge JSON endpoints
        run: |
          ./scripts/security_audit.sh --osv-only
          swift scripts/check_quality_metrics.swift --osv-ok --write-badges /tmp/basalt-badges
      - name: Push orphan badges branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tmp_index=$(mktemp)
          rm -f "$tmp_index"
          trap 'rm -f "$tmp_index"' EXIT
          for f in /tmp/basalt-badges/*.json; do
            blob=$(git hash-object -w "$f")
            GIT_INDEX_FILE="$tmp_index" git update-index --add --cacheinfo 100644 "$blob" "$(basename "$f")"
          done
          tree=$(GIT_INDEX_FILE="$tmp_index" git write-tree)
          commit=$(GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit-tree "$tree" -m "chore(badges): update quality metrics for ${{ github.sha }}")
          git push --force origin "$commit:refs/heads/badges"
