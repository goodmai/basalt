name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tagged commit is what the world downloads — refuse to publish one that
      # carries a credential. Same pattern set as the pre-publish sweep.
      - name: Secret scan
        run: |
          PAT='sk-ant-[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{32}|gh[pousr]_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|hf_[A-Za-z0-9]{30}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20}|BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY'
          if git grep -IlE "$PAT" -- . ; then
            echo "::error::possible credential in tracked files — release aborted"
            exit 1
          fi
          echo "clean"

      - name: Build
        run: swift build -c release

      # MLX aborts the whole test process when it cannot find a metallib, and a
      # SwiftPM build produces none — so the kernels have to exist before the
      # suite runs. Cached on Package.resolved: it only changes when mlx-swift
      # does, and compiling the kernels is the slowest thing in this workflow.
      - name: Cache MLX metallib
        uses: actions/cache@v6
        with:
          path: default.metallib
          key: metallib-${{ hashFiles('Package.resolved') }}

      - name: Compile MLX Metal kernels
        run: ./scripts/build_metal.swift   # no-op when the cache restored it

      - name: Test
        run: swift test

      # No prebuilt binary is published: the binary alone is useless without the
      # Metal library beside it, and a 130 MB metallib in every release is not
      # worth it when the formula builds from source anyway.
      - name: Hash the source tarball
        id: pkg
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          echo "tarball_sha=$(shasum -a 256 source.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Point the Homebrew formula at this tag
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          sed -i '' "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/gemm.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${{ steps.pkg.outputs.tarball_sha }}\"|" Formula/gemm.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gemm.rb
          git commit -m "chore: point formula at ${VERSION}" || echo "formula already current"
          git push origin HEAD:main || echo "push skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Gemm ${{ steps.pkg.outputs.version }}

            ```bash
            brew tap goodmai/basalt https://github.com/${{ github.repository }}
            brew install goodmai/basalt/gemm
            ```

            Builds from source: Xcode 16+, Apple Silicon, macOS 15+.

            **Source tarball SHA256**: `${{ steps.pkg.outputs.tarball_sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
