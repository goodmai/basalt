name: Release

on:
  push:
    tags:
      - 'v*'

# Re-cutting a tag never cancels a running release (a newer re-cut replaces a pending one):
# a cancelled run can leave a tag that has no Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    # macos-26: its default Xcode (26.4+) ships Swift 6.3, which mlx-swift's manifest
    # (tools-version 6.3) and hummingbird 2.27 (6.2) require. v0.3.0's first run failed on
    # macos-15 at dependency resolution.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # build/test run dependency code under a contents: write job: no token is left in
          # .git/config for it to push with. Only the formula step gets one, explicitly.
          persist-credentials: false

      - name: Configure Swift toolchain
        uses: ./.github/actions/xcode-toolchain

      # Xcode 26 ships the Metal compiler as a separate component; build_metal.swift needs it.
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      # A tagged commit is what the world downloads — refuse to publish one that
      # carries a credential. Same pattern set as the pre-publish sweep.
      - name: Secret scan
        run: |
          PAT='sk-ant-[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{32}|gh[pousr]_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|hf_[A-Za-z0-9]{30}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20}|BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY'
          if git grep -IlE "$PAT" -- . ; then
            echo "::error::possible credential in tracked files — release aborted"
            exit 1
          fi
          echo "clean"

      # The version the binary reports and the tag being released live in two
      # different places and nothing compared them; they agreed at v0.1.0 by luck.
      - name: Tag matches the version in the source
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          SRC=$(grep -oE 'static let version = "[^"]+"' Sources/BasaltCore/DTOs.swift | grep -oE '"[^"]+"' | tr -d '"')
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag v$TAG does not match HealthResponse.version ($SRC) in Sources/BasaltCore/DTOs.swift"
            exit 1
          fi
          echo "v$TAG matches the source"

      - name: Build
        run: swift build -c release

      - name: MLX Metal kernels
        uses: ./.github/actions/mlx-metallib

      - name: Test
        run: swift test

      # No prebuilt binary is published: the binary alone is useless without the
      # Metal library beside it, and a 130 MB metallib in every release is not
      # worth it when the formula builds from source anyway.
      - name: Hash the source tarball
        id: pkg
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          echo "tarball_sha=$(shasum -a 256 source.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      # Published before the formula step: a failing formula push must never leave a tag
      # without its Release (the verify step below still turns the run red).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Basalt ${{ steps.pkg.outputs.version }}

            ```bash
            brew tap goodmai/basalt https://github.com/${{ github.repository }}
            brew install goodmai/basalt/basalt
            ```

            Builds from source: Xcode 26.4+ (Swift 6.3) and a macOS it runs on, Apple Silicon.

            **Source tarball SHA256**: `${{ steps.pkg.outputs.tarball_sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main requires a PR (ruleset, no bot bypass), so a direct push of the formula was
      # always refused. The bump goes to a branch instead; merging its PR publishes the formula.
      # GITHUB_TOKEN can open that PR because the repository allows Actions to create PRs
      # (Settings → Actions → "Allow GitHub Actions to create and approve pull requests");
      # if that is ever turned off, the run warns with the link to open it by hand. A PR opened by GITHUB_TOKEN
      # triggers no workflows, so formula.yml (brew audit) runs only once it is merged; one
      # opened by hand from the link gets the audit on the PR.
      - name: Open a PR pointing the Homebrew formula at this tag
        id: formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          BRANCH="release/formula-${VERSION}"
          git fetch -q origin main
          # -f: build/test may have rewritten tracked files (Package.resolved) in the tag checkout.
          git checkout -q -f -B "$BRANCH" origin/main
          sed -i '' "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/basalt.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${{ steps.pkg.outputs.tarball_sha }}\"|" Formula/basalt.rb
          if git diff --quiet Formula/basalt.rb; then
            # Empty branch: verify main, never a stale release/formula-* left by an earlier cut.
            echo "branch=" >> $GITHUB_OUTPUT
            echo "formula already points at ${VERSION}"
            exit 0
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore: point formula at ${VERSION}" Formula/basalt.rb
          # gh wires GH_TOKEN into git's credential helper, so no token is spelled out in
          # this file. The previous push URL carried a redaction placeholder instead of the
          # token variable (a tool rewrote it when the line was written), so GitHub got that
          # placeholder as the password: "Invalid username or token" on v0.3.0's cut.
          gh auth setup-git
          git push -f origin "$BRANCH"
          # No `|| true`: a gh auth failure must fail here, not read as "no PR yet".
          OPEN=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$OPEN" ]; then
            echo "formula PR already open, updated by the push above: $OPEN"
          elif ! gh pr create --base main --head "$BRANCH" \
              --title "chore: point formula at ${VERSION}" \
              --body "Release ${VERSION}: tarball sha256 \`${{ steps.pkg.outputs.tarball_sha }}\`. Merge to publish the formula."; then
            echo "::warning::could not open the formula PR — open it by hand: https://github.com/${{ github.repository }}/compare/main...${BRANCH}"
          fi

      # The formula is what users install: read back what the bump branch (or main, when the
      # formula was already current) carries and compare it with the sha computed above.
      - name: Verify the formula bump
        run: |
          BRANCH="${{ steps.formula.outputs.branch }}"
          if [ -n "$BRANCH" ]; then
            git fetch -q origin "$BRANCH"
            REF=origin/$BRANCH
          else
            git fetch -q origin main
            REF=origin/main
          fi
          PUSHED=$(git show "$REF:Formula/basalt.rb" 2>/dev/null | grep -oE 'sha256 "[a-f0-9]{64}"' | head -1 | grep -oE '[a-f0-9]{64}' || true)
          if [ "$PUSHED" != "${{ steps.pkg.outputs.tarball_sha }}" ]; then
            echo "::error::Formula/basalt.rb on $REF carries sha256 '$PUSHED', expected ${{ steps.pkg.outputs.tarball_sha }}"
            exit 1
          fi
          echo "formula on $REF points at this tag's tarball"
