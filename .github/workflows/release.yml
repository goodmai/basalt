name: Release

on:
  push:
    tags:
      - 'v*'

# Re-cutting a tag queues a second run; let it wait rather than cancel, since a
# half-finished release leaves the formula pointing at a sha nobody computed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tagged commit is what the world downloads — refuse to publish one that
      # carries a credential. Same pattern set as the pre-publish sweep.
      - name: Secret scan
        run: |
          PAT='sk-ant-[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{32}|gh[pousr]_[A-Za-z0-9]{30}|github_pat_[A-Za-z0-9_]{30}|hf_[A-Za-z0-9]{30}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20}|BEGIN (RSA|OPENSSH|EC|PRIVATE) PRIVATE KEY'
          if git grep -IlE "$PAT" -- . ; then
            echo "::error::possible credential in tracked files — release aborted"
            exit 1
          fi
          echo "clean"

      # The version the binary reports and the tag being released live in two
      # different places and nothing compared them; they agreed at v0.1.0 by luck.
      - name: Tag matches the version in the source
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          SRC=$(grep -oE 'static let version = "[^"]+"' Sources/Gem/Core/DTOs.swift | grep -oE '"[^"]+"' | tr -d '"')
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag v$TAG does not match HealthResponse.version ($SRC) in Sources/Gem/Core/DTOs.swift"
            exit 1
          fi
          echo "v$TAG matches the source"

      - name: Build
        run: swift build -c release

      # MLX aborts the whole test process when it cannot find a metallib, and a
      # SwiftPM build produces none — so the kernels have to exist before the
      # suite runs. Cached on Package.resolved: it only changes when mlx-swift
      # does, and compiling the kernels is the slowest thing in this workflow.
      - name: Cache MLX metallib
        uses: actions/cache@v6
        with:
          path: default.metallib
          key: metallib-${{ hashFiles('Package.resolved') }}

      - name: Compile MLX Metal kernels
        # --skip-unsupported: the runner's SDK is older than the one MLX
        # targets, and a couple of kernels include headers that only exist in
        # the newer one. The library still loads, which is all the suite needs.
        run: ./scripts/build_metal.swift --skip-unsupported

      - name: Test
        run: swift test

      # No prebuilt binary is published: the binary alone is useless without the
      # Metal library beside it, and a 130 MB metallib in every release is not
      # worth it when the formula builds from source anyway.
      - name: Hash the source tarball
        id: pkg
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          echo "tarball_sha=$(shasum -a 256 source.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Point the Homebrew formula at this tag
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          sed -i '' "s|url \".*\"|url \"https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/basalt.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${{ steps.pkg.outputs.tarball_sha }}\"|" Formula/basalt.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/basalt.rb
          git commit -m "chore: point formula at ${VERSION}" || echo "formula already current"
          git push origin HEAD:main || echo "push skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Basalt ${{ steps.pkg.outputs.version }}

            ```bash
            brew tap goodmai/basalt https://github.com/${{ github.repository }}
            brew install goodmai/basalt/basalt
            ```

            Builds from source: Xcode 16+, Apple Silicon, macOS 15+.

            **Source tarball SHA256**: `${{ steps.pkg.outputs.tarball_sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The formula is what users install. Read back what main now carries and
      # compare it with the sha computed above: the push above is refused by the
      # main ruleset (it requires a PR, and the bot has no bypass), so today this
      # turns the run red until the formula is pushed by hand — after the Release
      # is published, so the signal never blocks the release itself.
      - name: Verify the pushed formula
        run: |
          git fetch -q origin main
          PUSHED=$(git show origin/main:Formula/basalt.rb 2>/dev/null | grep -oE 'sha256 "[a-f0-9]{64}"' | head -1 | grep -oE '[a-f0-9]{64}' || true)
          if [ "$PUSHED" != "${{ steps.pkg.outputs.tarball_sha }}" ]; then
            echo "::error::Formula/basalt.rb on main carries sha256 '$PUSHED', expected ${{ steps.pkg.outputs.tarball_sha }}"
            exit 1
          fi
          echo "formula on main points at this tag's tarball"
