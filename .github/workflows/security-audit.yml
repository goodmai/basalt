name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security audit every Monday at 9 AM
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manual trigger

jobs:
  security-audit:
    name: Security & Dependency Audit
    runs-on: macos-15
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      # No setup-swift: it pins an older toolchain than mlx-swift-lm's manifest
      # requires (tools 6.1), and every `swift package` call then fails to
      # resolve. The runner's own Xcode toolchain is newer and works.
      - name: Install dependencies
        run: |
          brew install jq
      
      # One script: the source checks and the OSV scan of Package.resolved. An affected
      # (or unchecked) dependency fails it with exit 1.
      - name: OSV scan self-test
        run: python3 scripts/security_audit_test.py

      - name: Run Security Audit Script
        run: |
          set -o pipefail  # keep the audit's exit status through tee
          chmod +x scripts/security_audit.sh
          ./scripts/security_audit.sh | tee audit-results.txt
      
      # The hardcoded-secret and SQL-injection greps that used to live here are
      # gone: scripts/security_audit.sh runs both, and keeping a second, weaker
      # copy in YAML meant fixing the pattern in one place and not the other.

      - name: Generate Security Report
        if: always()
        run: |
          echo "# Security Audit Report" > security-report.md
          echo "" >> security-report.md
          echo "**Date:** $(date)" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Toolchain" >> security-report.md
          swift --version >> security-report.md 2>&1 || true
          echo "" >> security-report.md
          echo "## Dependencies" >> security-report.md
          # Degrades instead of failing the job: the runner's toolchain is older
          # than mlx-swift's manifest declares (tools 6.3), so resolution can
          # fail here even though the release workflow builds fine. A report
          # that cannot draw a dependency tree is still a report.
          swift package show-dependencies >> security-report.md 2>&1 \
            || echo "(dependency tree unavailable: $(swift --version 2>&1 | head -1))" >> security-report.md
          echo "" >> security-report.md
          echo "## Audit Output (source checks + OSV)" >> security-report.md
          # The audit step's output already holds the OSV results: no second round of queries.
          # Fenced, so its ===== lines are not read as Markdown headings.
          if [ -f audit-results.txt ]; then
            { echo '````'; cat audit-results.txt; echo '````'; } >> security-report.md
          else
            echo "(audit did not run)" >> security-report.md
          fi
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: security-report.md
          retention-days: 30
      
      # No "✅ passed" PR comment: it added one comment per push, and the check status
      # already says the same thing.

  codeql-analysis:
    name: CodeQL Security Analysis
    # Manual only. CodeQL ships its own Swift toolchain — 6.1.0 in action 2.26.4
    # — and mlx-swift's manifest declares tools 6.3.0, so the extractor's build
    # step cannot resolve the package at all. (The release job builds on macos-26 with
    # Xcode 26.4+, Swift 6.3; this one would need the same plus a newer extractor.) Re-enable on push once
    # the extractor catches up; until then a job that is red on every commit
    # only teaches people to ignore the red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
      
      - name: Build project
        run: swift build
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
