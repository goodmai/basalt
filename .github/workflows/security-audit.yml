name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security audit every Monday at 9 AM
    - cron: '0 9 * * 1'
  workflow_dispatch: # Manual trigger

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Dependency Audit
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # the last step comments on the PR
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # No setup-swift: it pins an older toolchain than mlx-swift-lm's manifest
      # requires (tools 6.1), and every `swift package` call then fails to
      # resolve. The runner's own Xcode toolchain is newer and works.
      - name: Install dependencies
        run: |
          brew install jq
      
      - name: Run Security Audit Script
        run: |
          chmod +x scripts/security_audit.sh
          chmod +x osv_check.sh
          ./scripts/security_audit.sh
      
      - name: Run Dependency Vulnerability Scan
        run: |
          echo "Running OSV vulnerability scan..."
          ./osv_check.sh
      
      # The hardcoded-secret and SQL-injection greps that used to live here are
      # gone: scripts/security_audit.sh runs both, and keeping a second, weaker
      # copy in YAML meant fixing the pattern in one place and not the other.

      - name: Generate Security Report
        if: always()
        run: |
          echo "# Security Audit Report" > security-report.md
          echo "" >> security-report.md
          echo "**Date:** $(date)" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Toolchain" >> security-report.md
          swift --version >> security-report.md 2>&1 || true
          echo "" >> security-report.md
          echo "## Dependencies" >> security-report.md
          # Degrades instead of failing the job: the runner's toolchain is older
          # than mlx-swift's manifest declares (tools 6.3), so resolution can
          # fail here even though the release workflow builds fine. A report
          # that cannot draw a dependency tree is still a report.
          swift package show-dependencies >> security-report.md 2>&1 \
            || echo "(dependency tree unavailable: $(swift --version 2>&1 | head -1))" >> security-report.md
          echo "" >> security-report.md
          echo "## OSV Scan Results" >> security-report.md
          ./osv_check.sh >> security-report.md || true
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-report
          path: security-report.md
          retention-days: 30
      
      # Needs pull-requests: write, which the job did not have — every PR run
      # ended on a 403 here while pushes to main were green. A fork's token
      # stays read-only whatever the permissions block says, so skip those
      # rather than fail on them.
      - name: Comment PR with Security Status
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security audit passed! No vulnerabilities detected.'
            })

  codeql-analysis:
    name: CodeQL Security Analysis
    # Manual only. CodeQL ships its own Swift toolchain — 6.1.0 in action 2.26.4
    # — and mlx-swift's manifest declares tools 6.3.0, so the extractor's build
    # step cannot resolve the package at all. It is not the runner: the release
    # workflow builds the same commit on the same image. Re-enable on push once
    # the extractor catches up; until then a job that is red on every commit
    # only teaches people to ignore the red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # It burned 56 minutes before failing once. If it cannot finish in an hour
    # it is not going to.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
      
      - name: Build project
        run: swift build
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
