name: Unit Tests

on:
  # Branches are tested through their PR; a push trigger on them too ran every PR commit
  # twice on the single runner.
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - 'scripts/check_*'
      - '.github/workflows/no-comments.yml'
      - '.github/workflows/size-limits.yml'
      - '.github/workflows/concurrency-hatches.yml'
      - '.github/workflows/changed-coverage.yml'
      - 'scripts/concurrency-hatches.allow'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
      - 'scripts/check_*'
      - '.github/workflows/no-comments.yml'
      - '.github/workflows/size-limits.yml'
      - '.github/workflows/concurrency-hatches.yml'
      - '.github/workflows/changed-coverage.yml'
      - 'scripts/concurrency-hatches.allow'

# One self-hosted runner: a second push to the same ref makes the earlier run (queued or
# running) irrelevant, so cancel it instead of letting it hold the machine.
# On main the group is per commit, so every merge commit there keeps its own test result
# (a shared group holds one pending run and a newer one would replace it).
concurrency:
  group: unit-tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Dependency code runs here (build plugins, tests): it gets a read-only token.
permissions:
  contents: read

jobs:
  test:
    name: Swift Tests
    runs-on: [self-hosted, macOS, ARM64]
    # The runner is the owner's own machine and the repository is public. The real protection is
    # the repository setting "require approval for all external contributors" (a fork PR could
    # edit this file); this condition is a second layer that keeps fork PRs off the runner even
    # once a run is approved.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    # MLX serializes every eval on one mutex, so tests past half the cores only park cooperative
    # threads on it and starve live-server tests into their time limits; the run is no slower (#427).
    env:
      SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: 6
    steps:
      # clean: false keeps .build between runs on the self-hosted runner, so a run is an
      # incremental build instead of a from-scratch one. Safe only because fork PRs never
      # reach this runner (see `if:` above); tracked files are still reset to the commit.
      # Same-repo PRs (dependabot included) can leave edited dependency checkouts in .build,
      # so a later green run vouches for test results only — nothing built here is shipped.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          fetch-depth: 0

      - name: Configure Swift toolchain
        uses: ./.github/actions/xcode-toolchain

      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build tests
        run: swift build --build-tests --enable-code-coverage -Xswiftc -warnings-as-errors

      - name: MLX Metal kernels
        uses: ./.github/actions/mlx-metallib

      - name: Run unit tests
        run: swift test --enable-code-coverage

      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: swift scripts/check_changed_coverage.swift "$(swift test --show-codecov-path)" "origin/$BASE_REF"

      - name: Concurrency & Flake Repetition Gate (ST-0024)
        run: swift test --skip-build --enable-code-coverage --filter 'GenerationGateTests|PriorityAndPrefillCancellationTests|ServerDrainTests|TokenRecyclingTests|PromptLookupDecodingTests' --maximum-repetitions 10 --repeat-until fail
