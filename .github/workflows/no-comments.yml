name: No Comments

on:
  pull_request:

permissions:
  contents: read

jobs:
  no-comments:
    name: No new code comments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checker self-test
        run: python3 scripts/check_no_new_comments_test.py
      - name: Added lines carry no comments
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_no_new_comments.py "origin/$BASE_REF"
