name: Concurrency Hatches

on:
  pull_request:

permissions:
  contents: read

jobs:
  concurrency-hatches:
    name: No concurrency hatch outside the allowlist
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checker self-test
        run: swift scripts/check_concurrency_hatches_test.swift
      - name: Every hatch in Sources is allowlisted, every allowlist line still matches
        run: swift scripts/check_concurrency_hatches.swift
