name: Xcode toolchain
description: >
  Point DEVELOPER_DIR at the newest released Xcode and verify Swift 6.4+.
  Package.swift declares swift-tools-version 6.4, and a runner's xcode-select
  default or a symlinked Release Candidate can point elsewhere.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        APPS_DIR="${XCODE_APPS_DIR:-/Applications}"
        LATEST_XCODE=$(
          for app in "$APPS_DIR"/Xcode*.app; do
            [ -e "$app" ] || continue
            resolved=$(realpath "$app")
            printf '%s\n' "$resolved" | grep -qiE 'beta|_rc|release.candidate' && continue
            ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$resolved/Contents/Info.plist" 2>/dev/null || true)
            if [ -z "$ver" ]; then
              ver=$(basename "$resolved" .app | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1 || true)
            fi
            printf '%s\t%s\n' "${ver:-0}" "$resolved"
          done | sort -V -k1,1 | tail -n 1 | cut -f2-
        )
        if [ -n "$LATEST_XCODE" ] && [ -d "$LATEST_XCODE/Contents/Developer" ]; then
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "DEVELOPER_DIR=$LATEST_XCODE/Contents/Developer" >> "$GITHUB_ENV"
          fi
          export DEVELOPER_DIR="$LATEST_XCODE/Contents/Developer"
        fi
        echo "Selected Xcode: ${LATEST_XCODE:-default}"
        VERSION_OUT=$(swift --version 2>&1 || true)
        echo "$VERSION_OUT"
        SWIFT_VER=$(printf '%s\n' "$VERSION_OUT" | grep -oE 'Swift version [0-9]+\.[0-9]+' | awk '{print $3}' || true)
        if [ -z "$SWIFT_VER" ] || [ "$(printf '6.4\n%s\n' "$SWIFT_VER" | sort -V | head -n 1)" != "6.4" ]; then
          echo "::error::Swift 6.4+ is required (found '${SWIFT_VER:-unknown}' in ${LATEST_XCODE:-system default})"
          exit 1
        fi
