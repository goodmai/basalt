name: MLX metallib
description: >
  Restore or compile MLX's Metal kernels. MLX aborts the whole test process when it
  cannot find a metallib, and a SwiftPM build produces none. Cached on Package.resolved:
  it only changes when mlx-swift does, and compiling the kernels is the slowest step.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: default.metallib
        key: metallib-${{ hashFiles('Package.resolved') }}
    # A restored file keeps its old mtime, older than the fresh .metal checkouts, so
    # build_metal.swift would recompile anyway. An exact key hit means the same mlx-swift
    # revision (the key is Package.resolved), so the file is current: mark it as such.
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: touch default.metallib
    # --skip-unsupported: a runner SDK older than the one MLX targets lacks a couple of
    # headers some kernels include; the library still loads, which is all the suite needs.
    - shell: bash
      run: ./scripts/build_metal.swift --skip-unsupported
