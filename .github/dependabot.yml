version: 2
updates:
  # SwiftPM: mlx-swift and mlx-swift-lm move fast, and a model architecture we
  # need is often one release away. Weekly, so the PRs stay reviewable.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
