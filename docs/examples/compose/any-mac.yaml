version: 2
name: any-mac
memory: auto
budget: { usd_per_day: 1.00 }

variables:
  chat_repo: mlx-community/gemma-4-12B-it-qat-4bit

profiles:
  mac-16gb:
    when: { memory_gb: { under: 20 } }
    variables: { chat_repo: ornith-ai/Ornith-1.5-9B-MLX-4bit }
  mac-64gb:
    when: { memory_gb: { over: 48 } }

models:
  chat:
    source: ${chat_repo}
  ocr:
    source: mlx-community/PaddleOCR-VL-1.5-8bit
    keep: on-demand
    idle_unload: 2m
  big:
    source: lukaskremla/Qwen3.8-27B-3bit-MLX-TextOnly
    keep: on-demand
    idle_unload: 10m
    profiles: [mac-64gb]
  jev:
    source: cloud:openrouter/~typesafe/jev-latest
    api_key_env: OPENROUTER_API_KEY
  haiku:
    source: cloud:openrouter/anthropic/claude-haiku-5.5
    api_key_env: OPENROUTER_API_KEY
    budget: { usd_per_day: 0.50 }

pipeline:
  perceive:
    documents: [ocr, apple-vision]
  decide:
    cascade: [jev, chat]
    escalate_below: 0.6
  answer:
    routes:
      - when: { prompt_tokens: { over: 6000 }, cost_left: true }
        model: haiku
        fallback: chat
      - model: chat

pipelines:
  long:
    profiles: [mac-64gb]
    answer:
      routes:
        - when: { prompt_tokens: { over: 8000 } }
          model: big
        - model: chat
